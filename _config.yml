  - title: 문제 해결
    layout: list
    content:
      - title: LLM 기반 상품 검수 자동화 시스템 설계
        sub_title: 검수 인력 11명 → 3명, 1인당 처리량 5배, 창고 확장 없이 접수량 2배 수용
        caption: 마인이스 · 2024.10 ~ 2024.12
        skills: Go, Gin, Kafka, PostgreSQL
        description: |
          **문제 정의**
          - 서비스 성장으로 위탁판매 접수량이 1.5배 증가했고, 미처리 재고가 4주치까지 적체되며 창고 용량이 한계에 도달
          - 인력·창고 확장이 먼저 검토됐으나 검수 업무를 잘게 쪼개 보니 측정·직관적 기입은 병목이 아니었고, 자사 카테고리·소재·색상·스타일 등 해석 업무의 학습 비용이 병목이었다. 이 학습 비용이 신규 인력 온보딩 장기화와 숙련 이전 조기 이탈을 유발해, **"학습 비용이 높은 해석 업무를 사람 숙련 의존에서 떼어낸다"**로 문제를 재정의

          **기술 과제**
          - 상품 사진을 기반으로 카테고리·소재·색상·스타일·패턴 등 7개 속성을 추론해야 하며, 각 속성이 다수 컨텍스트의 결합 판단이라 숙련자의 암묵지에 의존
          - 현재 일 접수 5,000건 수준, 1년간 3배 성장 이력 + 중고패션 시장 성장 둔화 시점까지 **최소 2배 처리량(일 10,000건 이상)** 감당 설계가 필요해 1~2년 재확장 없이 운영 가능한 구조가 목표
          - 검수~전시 2시간 SLA: 검수 시작 알림과 완료 알림의 간격이 짧을수록 위탁자 반응이 빨라져 전시가 당일 시작된다는 내부 통계에 기반한 규칙

          **해결 전략**
          - 프롬프팅 전략
            - Multimodal 모델이 사진에서 특징·분류 후보를 추출, Text LLM이 자사 기준으로 매핑하는 **Vision → Text 2단 파이프라인**으로 "보는 것"과 "매핑하는 것"을 분리해 정확도 88%
            - 키워드 전처리로 입력 상품과 관련된 예시만 선별 주입하는 **동적 few-shot**으로 정확도 90% 달성
            - Fine-tuning + ensemble voting으로 93%까지 도달했으나 3%p 개선 대비 모델 관리 부담·비용이 과도해 미도입
          - 상품 속성 추론 병렬처리
            - 상품 검수 리드타임을 측정한 결과 접수 집중 시간대에 평균 4시간·SLA 달성률 55%까지 하락. 원인은 정확도 확보를 위한 프롬프트 분리·컨텍스트 누적으로 카테고리 속성이 p50 30초, 나머지 속성이 5~10초대를 소요해 7개 순차 처리 시 상품당 p50 80초가 유발된 것으로 측정
            - **fan-out** 동시 추론으로 상품당 p50 80초 → 30초 단축. 속성별 토픽 분리도 고려했으나 토픽 수 증가와 Orchestrator 구현 복잡도로 보류
            - 메시지 간 순서 제약이 없고 해당 컨슈머 그룹의 처리량만 병목인 국소 문제라 판단해 **병렬 Consumer**로 컨슈머 내부 병렬 처리를 채택. 파티션 증설도 고려했으나 파티션 수는 증가만 가능한 비가역 변경이라는 구조적 리스크, 상품 관련 이벤트가 대량 발생하는 시점이 먼 미래라는 근거로 현재 증설 시 과투자라 판단
          - 메시지 실패 복구
            - 메시지 처리 실패 시 **추론 실패 토픽**을 발행해 3회 재시도 후 DLQ로 이동, 나머지 처리 흐름이 차단되지 않도록 설계
            - 부분 실패의 경우 속성별 추론 상태를 DB에 기록해 재추론 시 미완료 속성만 처리되도록 설계, 건당 최대 6회의 불필요한 LLM 호출 제거
          - 외부 API 장애 격리
            - 외부 API 장기 장애 시 Consumer가 호출 timeout 대기에 점유돼 처리량이 회복되지 않으므로, **Circuit Breaker**로 열화를 조기 감지하고 즉시 **Fallback 모델(Gemini·Mistral)**로 전환하여 전시 중단 방지
            - 모델별 프롬프트로 Fallback 모델과 주 모델 간 정확도 편차 5%p 이내로 유지

          **결과**
          - 1인당 검수 처리량 300개 → 1,500개, 검수 인력 11명 → 3명, **월 1,500만원 운영비 절감** (창고 확장 없이 접수량 2배 수용)
          - 검수~전시 **SLA 달성률 55% → 95%**
          - LLM API 장애 상황 **DLQ 유입률 0.01%**

      - title: 선착순 쿠폰 lock-free 동시성 설계
        sub_title: 첫 구매 전환 700명, 동시 접속 200명 처리
        caption: 애즈위메이크 · 2023.05
        skills: Spring Boot, PostgreSQL, Redis
        description: |
          **문제**

          선착순 쿠폰 프로모션에서 동시 요청 시 정합성 보장 필요. 카운터 기반 차감은 단일 행에 경합 집중으로 동시성 병목

          **해결 과정**
          - **SKIP LOCKED 기반 lock-free 병렬 발급.** 쿠폰 N개 사전 생성, 잠긴 행은 건너뛰어 lock contention 제로. 비관적 락·분산 락은 결국 락을 잡는 구조로 경합 불가피, 메시지 큐는 예상 동시 접속 규모 대비 도입·운영 비용이 과도
          - **쿠폰 캐시로 불필요한 DB 접근 차단.** 전량 발급 시 Redis에 매진 상태를 캐싱하여 DB 도달 요청 자체를 제거. Redis 다운 시에도 DB 상태 컬럼이 정합성 보장

          **결과**
          - 첫 구매 전환 **700명**, 동시 접속 200명 처리, 초과 발급 **0건**

          **회고**
          - 트래픽 증가 시 메시지 큐 기반 비동기 발급으로 전환하면 다양한 요구사항에 유연하게 대응 가능
          - 유저 중복 발급 가능 요구사항 추가 시 DB 제약조건 변경이 필요한 설계는 확장성 측면에서 아쉬움

      - title: 상품 조회 캐시 적용
        sub_title: 상품 리스트 조회 API p95 500ms → 150ms, 피크 시 DB CPU 90% → 45%
        caption: 마인이스 · 2025.04
        skills: Go, Redis, PostgreSQL
        description: |
          **문제**

          피크 시간대 상품 조회 API p95 500ms 이상으로 SLO 미달, DB CPU 90%. 매 요청마다 DB 직접 조회하는 구조가 원인

          **해결 과정**
          - **Redis Cache-Aside로 DB 히트 감소.** 리스트 캐시(TTL 5분, stale 허용)와 상품 상세 캐시(상태 변경 시 즉시 eviction) 분리. 리스트 miss 시 ID만 조회 후 개별 캐시 확인, miss인 상품만 batch fetch. 쿼리 최적화는 인덱스 이미 적용 완료로 한계, Local Cache는 다중 서버에서 상품 상태 빈번 변경 시 일관성 보장 불가
          - **singleflight + TTL jitter로 cache stampede 방어.** 분산 락은 멀티 인스턴스 단일 실행을 보장하나 TTL 관리와 Redis 의존이 부담. singleflight는 프로세스 내 단일 실행이지만 stampede 해소에 충분하고 관리 포인트 적음. TTL에 jitter를 적용하여 서로 다른 키가 동시 만료되지 않도록 방지

          **결과**
          - 상품 조회 API p95 **500ms → 150ms**, 피크 시 DB CPU **90% → 45%**

      - title: 좋아요 집계 최적화
        sub_title: 상품 리스트 조회 API p99 10초 → 500ms, 상품 상세 조회 CTR 10% → 22% 개선
        caption: 애즈위메이크 · 2023.01
        skills: Spring Boot, PostgreSQL
        description: |
          **개요**

          팀 목표는 신규 가입자 확보. 가입자의 앱 경험 여부를 상품 상세 조회 진입으로 측정. 민원이 많았던 상품 리스트 속도 개선으로 기여하기로 함

          **문제**

          PLP p99이 10초. EXPLAIN ANALYZE 결과 인덱스는 이미 적용된 상태. **좋아요 수를 매 요청마다 JOIN + COUNT로 집계하는 구조**가 원인

          **해결 과정**
          - **실시간 집계 테이블로 JOIN + COUNT 제거.** 좋아요/취소 시 즉시 INCREMENT/DECREMENT. 조회 캐싱은 DB 조회마다 무거운 집계를 반복하는 구조 자체가 해소되지 않음. 배치 집계는 반영 지연과 규모 확대 시 복잡도 증가

          **결과**
          - 상품 리스트 조회 API p99 **10초 → 500ms**
          - 가입자 상품 상세 조회 CTR **10% → 22%** 개선

          **회고**
          - 현재는 좋아요/취소마다 DB 쓰기가 발생. 규모 확대 시 메시지 큐로 이벤트를 적재하고 배치 처리하여 쓰기 부하를 줄이는 방향으로 개선 가능

  - title: 스터디 활동
    layout: list
    content:
      - title: AI 에이전트 Tool 활용 공유 스터디
        caption: 2025.12 ~
        description: |
          - oh-my-opencode, ralph 등 AI 에이전트 Harness Engineering 구조 분석, 사용 및 구현
          - Context Engineering 방법론과 Agent Feedback Loop를 활용한 요구사항 정의-검증 파이프라인 체득 중
          - agent-browser 등 에이전트 도구의 워크플로우와 운용 전략을 공유하며 AI 협업 생산성 개선

