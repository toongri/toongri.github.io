about_content: | # this will include new lines to allow paragraphs
  **비즈니스 현장에서 문제를 정의하고, 기술로 풀어냅니다.** 상품 검수 병목을 현장 방문을 통해 분석해 문제를 정의하고, 자동화 시스템을 설계해 월 1,600만원 운영비를 절감했습니다.

  3년차 Go 백엔드 개발자로, 중고 의류 이커머스에서 상품 관리 및 물류 처리 시스템을 설계하고 구현해왔습니다.

  **필요한 기술을 빠르게 흡수합니다.** Go 경험 없이 입사해 첫 주 버그 수정, 2주 만에 첫 기능을 배포했습니다. AI 에이전트 도구를 적극 활용해 2개월간 스프린트당 처리량을 30% 향상시켰으며, 최근에는 지인들과 케이스 스터디를 통해 함께 숙련도를 높이고 있습니다.
content:
  - title: 경력
    layout: list
    content:
      - layout: left
        title: 마인이스
        link: https://www.mineis.io/
        sub_title: Backend Engineer
        caption: 2024.05 ~ 2025.11
        quote: >
          중고 패션 위탁판매 이커머스 ‘차란‘ 운영
        description: |
          - LLM 기반 상품 메타데이터 추론 시스템 개발로 **월 1,500만원** 운영비 절감
          - 현장 주도 공정 조건 관리 시스템을 구축하여 조건 변경 리드타임 **2주 → 즉시** 단축
          - Redis 캐시 적용으로 피크 시간대 상품 조회 SLO 미달 해소 (p95 **500ms → 150ms**)
          - 테스트 부재 환경에서 유닛 테스트 도입 주도, 커버리지 **0% → 20%** 및 주간 버그 리포트 **10건 → 7건** 감소
      - layout: left
        title: 애즈위메이크
        link: https://www.aswemake.com/
        sub_title: Backend Engineer
        caption: 2022.07 ~ 2023.06
        quote: >
          로컬 마트 주문 중개 플랫폼 '큐마켓' 운영
        description: |
          - 좋아요 집계 테이블 도입 및 인덱스 최적화로 상품 조회 p99 **10초 → 500ms** 단축, 가입자 상품 상세 조회 CTR **10% → 22%** 개선
          - 상품 일괄 등록 비동기 전환으로 마트 관리자 등록 대기 시간 **3분 → 30초** 단축
          - 결제 상태 동기화 스케줄러 도입으로 결제-주문 불일치 **주 5건 → 0건**

  - title: 문제 해결
    layout: list
    content:
      - layout: top-left
        title: 상품 메타데이터 추론 시스템 개발
        sub_title: 1인당 검수 처리량 5배 향상, 월 1,500만원 운영비 절감
        caption: 마인이스 · 2024.10 ~ 2024.11
        skills: Go, Gin, Kafka, PostgreSQL
        description: |
          **[문제]**
          - 서비스 성장으로 위탁판매 요청량 1.5배 증가, 미처리 재고 4주치 적체, 창고 용량 한계 도달
          - 병목은 인력이 아닌 **숙련도 의존성**: 고숙련 판단 업무 → 긴 온보딩 → 숙련 전 퇴사 반복의 악순환
          - **문제 재정의: 인력 충원이 아닌 숙련도 의존성 자체를 제거해야 하는 문제**

          **[해결 과정]**
          
          **시도 1 — 속성별 독립 요청 + few-shot**
          - 속성별 분리 + few-shot 주입: 정확도 ~80%까지 개선. 하지만 few-shot 예시를 늘려도 변화 미미, 80%에서 정체.
          - 멀티모달 모델에 텍스트 예시를 주는 것만으로는 이미지 인식 방식 자체를 바꿀 수 없다고 판단. 예시를 아무리 정교하게 넣어도 이미지를 "보는" 과정에 자사 기준이 반영되지 않음.
          - "보는 것"과 "매핑하는 것"을 분리해야 하는 문제로 전환.

          **시도 2 — Vision/Text 2단계 파이프라인**
          - 1단계 Vision LLM: 사진에서 특징/후보를 자유 서술. 자사 기준은 요구하지 않고 모델이 잘하는 "보기"에만 집중.
          - 2단계 Text LLM: 1단계 서술을 입력받아 few-shot 기반 자사 기준 매핑. 이미지가 아닌 텍스트이기에 few-shot이 정확하게 작동.
          - 멀티모달 5종 비교 후 GPT-4o 선택: **정확도 85%, 일관성 95%**로 최고 성능.

          **시도 3 — 동적 few-shot**
          - 정적 few-shot 예시를 수십 개로 늘려봤으나 latency만 증가, 정확도 90% 미달. 모든 요청에 동일한 대량 예시가 비효율적.
          - 키워드 전처리로 입력 상품과 관련된 예시만 선별 주입. 불필요한 예시 제거 + 관련 예시 집중으로 **정확도 90%** 달성.

          **이후 — 보류**
          - fine-tuning + ensemble voting으로 정확도 93% 달성. 비용 5% 증가지만 파이프라인 변동 리스크로 보류. 반복 오류는 수동 후보정으로 커버.

          **프로덕션 시스템 설계**
          - 전시 주기 2시간 SLA에 배치 미달로 건별 즉시 추론 선택. Kafka + Transactional Outbox로 기존 인프라 재활용, rate limit 분산, At-least-once 보장. Retry → CB → Fallback → Bulkhead 체인으로 **최종 성공률 99.99%.**

          **[검증]**
          - 자체 채점 API로 1,000건 테스트(기검증 50% + 신규 50%). **정확도 90%, 일관성 95%.**

          **기여 성과**
          - 1인당 검수 처리량 200개 → 1,000개
          - 미처리 재고 4주치 → 1주치
          - 검수 인력 11명 → 3명 (**월 1,500만원** 순 운영비 절감)
      - layout: top-left
        title: 현장 주도 공정 조건 관리 시스템 구축
        sub_title: 조건 변경 리드타임 2주 → 즉시, 개발팀 의존성 완전 제거
        caption: 마인이스 · 2025.01 ~ 2025.02
        skills: Go, Gin, Kafka, PostgreSQL
        description: |
          **문제 인식**
          - 자사 상품 가품 판정으로 3배 배상 사건 발생
          - 이후 브랜드별 정품 검증 등 공정 조건 변경 요청 급증
            
          **문제 정의**
          - 4개 공정(행거 촬영, 테이블 촬영, 정품 검증, 추가 촬영)의 진입 조건이 코드에 하드코딩
          - 조건 변경마다 배포 필요 (배포 주기 2주)로 비즈니스 요구 대응 지연
            
          **주요 업무**
          - 사이드 프로젝트로 MVP 검증 후 정식 시스템으로 발전시킨 공정 라우팅 Rule Engine 단독 설계 및 구현
            
          **해결 전략**
          - **MVP 검증: Firebase Remote Config 기반 빠른 가설 검증**
            - 팀 내 기존 사용 스펙으로 추가 인프라 없이 즉시 적용
            - 관리 화면 없이 서버 단독 구현으로 빠른 검증에 집중
            - 10분 주기 polling 방식 선택 (실시간성 불필요, webhook 대비 구현 단순)
            - polling 실패 시 기존 데이터 유지로 서비스 중단 방지
            - 1개월 운영 후에도 주 3-5회 변경 발생 → 본격 시스템화 필요성 확인
          - **운영 시스템 전환: DB + 관리 화면 구축**
            - 지속적 변경 빈도 확인으로 현장 담당자가 직접 관리할 수 있는 UI 필요성 대두
            - Rule 테이블 설계 및 관리 API 개발
            - 관리자 화면에서 브랜드/카테고리/가격 등 조건 기반 공정 진입 규칙 설정
            - 현장 리더 교육 1시간 + 가이드 문서 제공으로 개발팀 의존성 완전 제거
          - **JSON 기반 자체 Rule Engine 구현**
            - Go 환경에서 사용 가능한 성숙한 Rule Engine 부재로 자체 구현
            - "A 브랜드이면서 가격 50만원 이상" 같은 복합 조건 요구로 재귀적 AND/OR 조합 지원
            - 공정별 독립 Rule + 우선순위 기반 라우팅으로 상품 상태에 따른 동적 공정 결정
          - **비개발자 운영 환경의 안정성 확보**
            - 현장 담당자의 잘못된 Rule 등록으로 공정이 깨지는 것을 방지
            - Rule 등록/수정 시 JSON 구조 및 필드 타입 검증
            - Preview API로 실제 상품 대상 Rule 적용 결과 사전 확인
            - 형식 오류 시 등록 차단 및 명확한 에러 응답
          
          **성과**
          - 공정 조건 변경 리드타임: 2주 이상 → 즉시 적용
          - 개발팀 Rule 변경 요청: 주 2건 → 0건 (현장 담당자 자체 처리)
      - layout: top-left
        title: 선착순 쿠폰 동시성 이슈 긴급 대응
        sub_title: 2시간 내 핫픽스 완료, 추가 인프라 없이 문제 해결
        caption: 애즈위메이크 · 2022.10
        skills: Spring Boot, PostgreSQL
        description: |
          **문제 인식**
          - 큐마켓 한정 수량(300매) 쿠폰 프로모션 중 초과 발급 발생 (예산 초과 및 성과 측정 차질)
          - 다음날 2차 이벤트가 예정되어 있어, 인프라 도입 등 긴 리드타임이 필요한 해결책 적용 불가         
          
          **문제 정의**
          - 트랜잭션 내에서 재고 조회와 차감 사이에 발생하는 race condition 확인
          
          **주요 업무**
          - race condition 해결을 위한 동시성 제어 로직 구현 및 정합성 검증
          
          **해결 전략**
          - **원자적 갱신 적용**
            - Redis 분산락이 DB 부하 감소에 효과적이나, 도입 및 테스트에 24시간 이상 소요될 리스크 존재
            - 트래픽 규모 고려 시 RDB의 row-level lock으로 처리 가능하다고 판단
            - 애플리케이션 레벨의 잠금 대신 `UPDATE ... SET stock = stock - 1 WHERE ... AND stock > 0` 쿼리 사용
            - DB의 원자성을 이용해 별도 락 구현 없이 동시 요청에 대한 순차적 처리 보장
          - **검증 및 모니터링**
            - k6 200 VU 부하 테스트로 동시 요청 시나리오 검증 (p95 1초 이내) 후 배포
            - 재고 소진 시점에 Slack Webhook을 발송하도록 구현 하여 운영팀에 이벤트 종료 상황 공유
          
          **성과**
            - 이슈 발생 2시간 내 핫픽스 완료, 다음날 2차 이벤트 초과 발급 0건 방어
            - 추가 인프라 비용 없이 기존 자원만으로 비즈니스 리스크 해소

