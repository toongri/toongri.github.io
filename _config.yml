  - title: 문제 해결
    layout: list
    content:
      - layout: top-left
        title: 상품 메타데이터 추론 시스템 개발
        sub_title: 1인당 검수 처리량 5배 향상, 월 1,500만원 운영비 절감
        caption: 마인이스 · 2024.10 ~ 2024.11
        skills: Go, Gin, Kafka, PostgreSQL
        description: |
          **[문제]**
          - 서비스 성장으로 위탁판매 요청량 1.5배 증가, 미처리 재고 4주치 적체, 창고 용량 한계 도달
          - 병목은 인력이 아닌 **숙련도 의존성**: 고숙련 판단 업무 → 긴 온보딩 → 숙련 전 퇴사 반복의 악순환
          - **문제 재정의: 인력 충원이 아닌 숙련도 의존성 자체를 제거해야 하는 문제**

          **[해결 과정]**
          
          **시도 1 — 속성별 독립 요청 + few-shot**
          - 속성별 분리 + few-shot 주입: 정확도 ~80%까지 개선. 하지만 few-shot 예시를 늘려도 변화 미미.
          - multimodal 모델에 텍스트 예시를 주는 것만으로는 이미지 인식 방식 자체를 바꿀 수 없다고 판단.
          - "보는 것"과 "매핑하는 것"을 분리해야 하는 문제로 전환.

          **시도 2 — Vision/Text 2단계 파이프라인**
          - multimodal 모델을 통해 사진에서 특징 및 분류 후보를 추출.
          - 추출 결과를 text llm을 통해  few-shot 기반 자사 기준 매핑. 이미지가 아닌 텍스트이기에 few-shot이 정확하게 작동.

          **시도 3 — 동적 few-shot**
          - 정적 few-shot 예시를 수십 개로 늘려봤으나 목표 정확도 90% 미달. 모든 요청에 동일한 대량 예시가 비효율적.
          - 키워드 전처리로 입력 상품과 관련된 예시만 선별 주입. 불필요한 예시 제거 + 관련 예시 집중으로 **정확도 90%** 달성.
          - fine-tuning + ensemble voting으로 정확도 93% 도달. 단, 3%p 개선 대비 유지보수 복잡도가 과도해 미적용.

          **검증**
          - 자체 채점 API로 1,000건 테스트(기검증 50% + 신규 50%). **정확도 90%, 일관성 95%.**
          
          **프로덕션 시스템 설계**
          - 전시 주기 2시간 SLA에 배치 미달로 건별 즉시 추론 선택. Kafka + Transactional Outbox로 기존 인프라 재활용, rate limit 분산, At-least-once 보장. Retry → CB → Fallback → Bulkhead 체인으로 **최종 성공률 99.99%.**

          **[결과]**
          - 1인당 검수 처리량 200개 → 1,000개
          - 미처리 재고 4주치 → 1주치
          - 검수 인력 11명 → 3명 (**월 1,500만원** 순 운영비 절감)
          
          **[회고]**
          - 개인적으로 fine-tuning과 ensemble voting을 실험해 93%까지 끌어올렸지만, 3%p 개선 대비 모델 관리 부담과 비용 증가가 과도하다고 판단해 팀에는 제안서로 공유했습니다.
          - 기술적 완성도가 곧 정답이라 생각했지만, 지표 중심 팀에서 임팩트·리소스·유지보수 비용을 함께 저울질하는 시야가 생겼습니다. 동시에 현재에 안주하지 않고, 개선 가능성을 검증해 팀에 선택지를 제공하는 습관도 이때 자리 잡았습니다.

      - layout: top-left
        title: 좋아요 집계 최적화
        caption: 애즈위메이크 · 2023.01
        skills: Spring Boot, PostgreSQL
        description: |
          - 상품 리스트 조회 p99 10초, 좋아요 수를 매 요청마다 COUNT 집계하는 구조적 한계
          - EXPLAIN ANALYZE에서 JOIN + SUM 연산의 시간·메모리 과다 사용 확인, 집계 테이블 분리 + 복합 인덱스로 읽기 부하 제거
          - p99 **10초 → 500ms** 단축, 가입자 상품 상세 조회 CTR **10% → 22%** 개선
      - layout: top-left
        title: 선착순 쿠폰 동시성 이슈 대응
        caption: 애즈위메이크 · 2022.10
        skills: Spring Boot, PostgreSQL
        description: |
          - 한정 수량(300매) 쿠폰 초과 발급 발생, 다음날 2차 이벤트 예정으로 즉시 대응 필요
          - 재고 조회-차감 사이 race condition 확인, `UPDATE ... WHERE stock > 0` 원자적 갱신으로 추가 인프라 없이 해결
          - k6 200 VU 부하 테스트로 동시 요청 시나리오 검증 (p95 1초 이내)
          - **2시간** 내 핫픽스 완료, 2차 이벤트 초과 발급 **0건**
      - layout: top-left
        title: 상품 조회 캐시 적용
        caption: 마인이스 · 2025.04
        skills: Go, Redis, PostgreSQL
        description: |
          - 피크 시간대 상품 조회 p95 500ms로 SLO 미달, 반복 조회 상품의 캐시 부재가 원인
          - Redis 캐시 적용으로 DB 직접 조회 부하 제거
          - p95 **500ms → 150ms** 달성, DB 부하 **50%** 감소

