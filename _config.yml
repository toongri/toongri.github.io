  - title: 문제 해결
    layout: list
    content:
      - layout: top-left
        title: 상품 메타데이터 추론 시스템 개발
        sub_title: 1인당 검수 처리량 5배 향상, 월 1,500만원 운영비 절감
        caption: 마인이스 · 2024.10 ~ 2024.11
        skills: Go, Gin, Kafka, PostgreSQL
        description: |
          **[문제]**
          서비스 성장으로 위탁판매 요청량 1.5배 증가, 미처리 재고 4주치 적체, 창고 용량 한계 도달. 위탁 판매자 불만 문의 폭증.
          현장 방문 및 검수 프로세스 분석 결과, 병목은 인력이 아닌 **숙련도 의존성**: 브랜드/소재/카테고리/색상/스타일 판단이 복합적 컨텍스트를 요구하는 고숙련 업무. 높은 숙련도 요구 → 긴 온보딩 → 숙련 전 퇴사 반복의 악순환. 인력 충원이 근본 해결책이 될 수 없는 구조.
          **문제 재정의: 인력 충원이 아닌 숙련도 의존성 자체를 제거해야 하는 문제.**

          **[해결 과정]**

          **시도 1 — 사진 한 장으로 모든 속성 동시 추출**
          처음엔 프롬프트만 잘 쓰면 될 줄 알았다. 멀티모달 모델에 사진과 함께 카테고리·소재·색상·스타일을 한 번에 요청. **정확도 60~70%.** 핵심 원인: 자사 카테고리 체계가 LLM의 일반 분류와 달랐고, 하나의 요청에 너무 많은 속성이 경합하며 정확도가 전반적으로 하락.

          **시도 2 — 속성별 독립 요청 + few-shot**
          각 속성(카테고리, 소재, 색상, 스타일)을 독립 요청으로 분리. few-shot으로 "이 특징이면 자사 기준 이 카테고리"를 직접 주입 시도. 하지만 멀티모달 모델은 이미지 기반이라 텍스트 few-shot의 영향력이 제한적. 예시를 아무리 넣어도 이미지를 "보는" 과정에서 자사 기준이 반영되지 않았다.
          → 깨달음: **"보는 것"과 "우리 기준으로 매핑하는 것"은 본질적으로 다른 문제다.**

          **시도 3 — 2단계 파이프라인: Vision 추출 → Text 매핑**
          1단계: 멀티모달 LLM이 사진을 보고 자유롭게 판단. "이 상품이 어떤 카테고리에 해당하는지, 왜 그렇게 생각하는지, 어떤 특징이 보이는지" 상세하게 여러 후보를 리스트업. 모델 고유의 표현으로 풍부하게 서술하게만 하고, 자사 기준은 요구하지 않음.
          2단계: 텍스트 전용 모델이 1단계의 서술을 받아서, few-shot 기반으로 "이런 특징이 보이면 자사 기준 이 카테고리, 이 스타일"로 매핑. 이미지가 아닌 텍스트이기에 few-shot이 정확하게 작동.
          **핵심: Vision이 잘하는 "보는 것"과 Text가 잘하는 "도메인 매핑"을 분리한 것이 돌파구.** 멀티모달 모델 5종 비교 테스트 후 GPT-4o 선택. 정확도 85%, 일관성 95% → 배포.

          **배포 후 — 동적 few-shot으로 90% 달성**
          현장 피드백: "정확도를 조금만 더 올려달라." few-shot 예시를 수십 개로 늘려봤으나 latency만 증가, 90% 미달. 모든 요청에 동일한 대량 예시를 넣는 것이 비효율적이라 판단.
          동적 few-shot 도입: 키워드 전처리로 입력 상품과 관련된 예시만 선별 주입. 매칭 키워드가 없으면 경량 모델이 적합한 키워드를 추천하여 관련 few-shot 자동 채움. 불필요한 예시는 빠지고 관련 예시만 들어가니 **정확도 90%** 도달 → 배포.

          **이후 — 93% 가능, 그러나 중단**
          퇴근 후 개인 시간에 fine-tuning + voting(다수결) 기법까지 실험하여 93% 달성. 제안서 제출. 그러나 추론 프로세스 변동에 대한 운영 리스크, 추가 API 비용 대비 현장에서의 이득이 크지 않아 보류 결정. **기술적으로 더 할 수 있었지만 멈추는 것도 엔지니어링 판단.**

          **프로덕션 시스템 설계**
          - **배치 vs 이벤트 기반**: 배치 처리 시 3,000건 추론에 1시간+ 소요, 2시간 전시 주기 충족 불가. 공정 순환이 빨라야 창고 비용을 최소화할 수 있기에 검수 완료 즉시 건별 추론을 시작하는 이벤트 기반 비동기 처리 선택.
          - **Kafka + Transactional Outbox**: 기존 Kafka 이벤트 버스 활용으로 LLM rate limit 내 요청 자연 분산 및 영속성 확보. Transactional Outbox Pattern으로 At-least-once 보장, 추론 누락 방지.
          - **LLM API 장애 내성**: 일시적 불안정 대응 Exponential Backoff Retry → 지속적 실패 시 Circuit Breaker로 연쇄 장애 차단 → GPT-4o 실패(2%)를 Fallback 체인으로 커버하여 최종 성공률 99.99% → LLM 호출 지연 전파 방지를 위한 Bulkhead 리소스 격리 → 최종 실패 시 DLQ + Slack 알림으로 수동 처리 대상 추적.

          **[검증]**
          어드민 서버에 채점 API를 직접 구축. 기존 상품 ID를 대량 투입하면 비동기 순차 처리 후 테스트 DB에 적재, 채점 결과 API로 정합률 확인. 동일 상품 중복 투입으로 일관성 별도 채점.
          공식 테스트: 기검증 데이터 50% + 신규 데이터 50%, **1,000건 기준**. 최종: **정확도 90%, 일관성 95%.**

          **[회고]**
          정확도가 안 나올 때 RAG, fine-tuning 같은 고급 기법에서 답을 찾으려 했지만, 돌파구는 기초적인 책임 분리였다. 이미지를 텍스트로 전환하는 책임과 텍스트를 자사 기준으로 매핑하는 책임을 나누니, few-shot 예시가 직관적으로 적용되며 정확도가 급등했다.
          10%는 여전히 틀린다. 현장에서 반복적 오류 패턴이라 운영 부하는 크지 않다. fine-tuning + voting으로 93%까지 준비되어 있으며, 비즈니스 판단에 따라 즉시 적용 가능.

          **기여 성과**
          - 1인당 검수 처리량 200개 → 1,000개 (5배)
          - 미처리 재고 4주치 → 1주치
          - 검수 인력 11명 → 3명 (**월 1,500만원** 순 운영비 절감)
      - layout: top-left
        title: 현장 주도 공정 조건 관리 시스템 구축
        sub_title: 조건 변경 리드타임 2주 → 즉시, 개발팀 의존성 완전 제거
        caption: 마인이스 · 2025.01 ~ 2025.02
        skills: Go, Gin, Kafka, PostgreSQL
        description: |
          **문제 인식**
          - 자사 상품 가품 판정으로 3배 배상 사건 발생
          - 이후 브랜드별 정품 검증 등 공정 조건 변경 요청 급증
            
          **문제 정의**
          - 4개 공정(행거 촬영, 테이블 촬영, 정품 검증, 추가 촬영)의 진입 조건이 코드에 하드코딩
          - 조건 변경마다 배포 필요 (배포 주기 2주)로 비즈니스 요구 대응 지연
            
          **주요 업무**
          - 사이드 프로젝트로 MVP 검증 후 정식 시스템으로 발전시킨 공정 라우팅 Rule Engine 단독 설계 및 구현
            
          **해결 전략**
          - **MVP 검증: Firebase Remote Config 기반 빠른 가설 검증**
            - 팀 내 기존 사용 스펙으로 추가 인프라 없이 즉시 적용
            - 관리 화면 없이 서버 단독 구현으로 빠른 검증에 집중
            - 10분 주기 polling 방식 선택 (실시간성 불필요, webhook 대비 구현 단순)
            - polling 실패 시 기존 데이터 유지로 서비스 중단 방지
            - 1개월 운영 후에도 주 3-5회 변경 발생 → 본격 시스템화 필요성 확인
          - **운영 시스템 전환: DB + 관리 화면 구축**
            - 지속적 변경 빈도 확인으로 현장 담당자가 직접 관리할 수 있는 UI 필요성 대두
            - Rule 테이블 설계 및 관리 API 개발
            - 관리자 화면에서 브랜드/카테고리/가격 등 조건 기반 공정 진입 규칙 설정
            - 현장 리더 교육 1시간 + 가이드 문서 제공으로 개발팀 의존성 완전 제거
          - **JSON 기반 자체 Rule Engine 구현**
            - Go 환경에서 사용 가능한 성숙한 Rule Engine 부재로 자체 구현
            - "A 브랜드이면서 가격 50만원 이상" 같은 복합 조건 요구로 재귀적 AND/OR 조합 지원
            - 공정별 독립 Rule + 우선순위 기반 라우팅으로 상품 상태에 따른 동적 공정 결정
          - **비개발자 운영 환경의 안정성 확보**
            - 현장 담당자의 잘못된 Rule 등록으로 공정이 깨지는 것을 방지
            - Rule 등록/수정 시 JSON 구조 및 필드 타입 검증
            - Preview API로 실제 상품 대상 Rule 적용 결과 사전 확인
            - 형식 오류 시 등록 차단 및 명확한 에러 응답
          
          **성과**
          - 공정 조건 변경 리드타임: 2주 이상 → 즉시 적용
          - 개발팀 Rule 변경 요청: 주 2건 → 0건 (현장 담당자 자체 처리)
      - layout: top-left
        title: 선착순 쿠폰 동시성 이슈 긴급 대응
        sub_title: 2시간 내 핫픽스 완료, 추가 인프라 없이 문제 해결
        caption: 애즈위메이크 · 2022.10
        skills: Spring Boot, PostgreSQL
        description: |
          **문제 인식**
          - 큐마켓 한정 수량(300매) 쿠폰 프로모션 중 초과 발급 발생 (예산 초과 및 성과 측정 차질)
          - 다음날 2차 이벤트가 예정되어 있어, 인프라 도입 등 긴 리드타임이 필요한 해결책 적용 불가         
          
          **문제 정의**
          - 트랜잭션 내에서 재고 조회와 차감 사이에 발생하는 race condition 확인
          
          **주요 업무**
          - race condition 해결을 위한 동시성 제어 로직 구현 및 정합성 검증
          
          **해결 전략**
          - **원자적 갱신 적용**
            - Redis 분산락이 DB 부하 감소에 효과적이나, 도입 및 테스트에 24시간 이상 소요될 리스크 존재
            - 트래픽 규모 고려 시 RDB의 row-level lock으로 처리 가능하다고 판단
            - 애플리케이션 레벨의 잠금 대신 `UPDATE ... SET stock = stock - 1 WHERE ... AND stock > 0` 쿼리 사용
            - DB의 원자성을 이용해 별도 락 구현 없이 동시 요청에 대한 순차적 처리 보장
          - **검증 및 모니터링**
            - k6 200 VU 부하 테스트로 동시 요청 시나리오 검증 (p95 1초 이내) 후 배포
            - 재고 소진 시점에 Slack Webhook을 발송하도록 구현 하여 운영팀에 이벤트 종료 상황 공유
          
          **성과**
            - 이슈 발생 2시간 내 핫픽스 완료, 다음날 2차 이벤트 초과 발급 0건 방어
            - 추가 인프라 비용 없이 기존 자원만으로 비즈니스 리스크 해소

  - title: 기술
    layout: list
    content:
      - title: 언어
