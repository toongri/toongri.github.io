about_content: |
  **이커머스 도메인 백엔드 3년차.** 상품과 셀러 어드민 영역을 주로 다뤘고, 최근에는 위탁판매 상품 입고와 등록 자동화 파이프라인을 개발했습니다.

  **당연해 보이는 원인일수록 다시 확인합니다.** 엉뚱한 문제를 풀면 상황은 개선되지 않기 때문입니다. 상품 검수 인력이 부족하다는 판단에 인력충원을 준비하던 중 현장 라인을 방문해 병목을 확인하고, 검수 자동화를 통해 1인당 처리량을 5배로 끌어올리고 월 1,500만원 운영비를 절감했습니다.

  **배포 후 지표를 확인할 때까지 기능을 놓지 않습니다.** 코드를 배포했다고 끝난 게 아니라, 실제로 지표가 움직였는지 확인해야 비로소 마무리된다고 생각하기 때문입니다. 좋아요 집계 개선 후 가입자 상품 상세 조회 CTR 10%→22%를 확인하고, 캐시 적용 후 p95와 DB CPU 메트릭으로 효과를 검증한 뒤에야 마무리했습니다.

  최근에는 AI 에이전트를 활용한 개발 생산성 개선에 여러 시도를 하고 있습니다. 리뷰에 드는 시간을 줄이면 전체 개발 속도가 빨라질 것이라 판단했고, 여러 모델에게 청크 단위로 리뷰를 맡긴 뒤 오케스트레이터가 합의를 도출하는 구조로 에이전트 리뷰의 커버리지와 신뢰도를 높여, 사람은 핵심만 확인하면 되는 흐름을 만들어 가고 있습니다.
