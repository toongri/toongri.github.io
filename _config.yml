        quote: >
          중고 패션 위탁판매 이커머스 '차란' 운영
        description: |
          - LLM을 이용한 상품 검수 자동화로 **월 1,500만원** 운영비 절감
          - 현장 주도 공정 조건 관리 시스템을 구축하여 조건 변경 리드타임 **2주 → 즉시** 단축
          - Redis 캐시 적용으로 피크 시간대 상품 조회 p95 **500ms → 150ms**, DB CPU **90% → 45%**
      - title: 애즈위메이크
