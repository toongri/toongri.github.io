  - title: 스터디 활동
    layout: list
    content:
      - title: AI 에이전트 Tool 활용 공유 스터디
        link: https://github.com/toongri/oh-my-toong-playground
        caption: 2025.12 ~
        description: |
          - oh-my-opencode, oh-my-claudecode, ralph 등 AI 코딩 도구의 확장 구조 분석, 사용 및 구현
          - 요구사항을 명확하게 전달하기 위한 컨텍스트 엔지니어링 방법론 체득 중
          - 각자의 워크플로우와 프롬프트 전략을 공유하며 AI 협업 생산성 개선

      - title: 유닛 테스트 스터디
        sub_title: 사내 스터디 (마인이스)
        caption: 2025.02 - 2025.05
        description: |
          - 「Unit Testing」, 「단위 테스트의 기술」을 읽으며 좋은 테스트의 4가지 요소와 단위 테스트의 역할 학습
          - 리팩터링 내성에 대해 깊이 고민한 뒤, 실무에서 블랙박스 테스트를 적용하여 내부 로직이나 스펙 변경에도 테스트가 깨지지 않는 구조로 작성

      - title: 객체지향 설계 스터디
        sub_title: 사내 스터디 (애즈위메이크)
        caption: 2022.09 ~ 2023.01
        description: |
          - 「객체지향의 사실과 오해」, 「오브젝트」를 읽으며 책임 주도 설계 방법론 학습
          - 객체지향 원칙을 도메인 모델과 인프라 계층에 적용하여 확장에 용이한 구조로 개발

