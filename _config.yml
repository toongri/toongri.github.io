          - oh-my-opencode, oh-my-claudecode, ralph 등 AI 코딩 도구의 확장 구조 분석, 사용 및 구현
          - 요구사항을 명확하게 전달하기 위한 컨텍스트 엔지니어링 방법론 체득 중
          - 각자의 워크플로우와 프롬프트 전략을 공유하며 AI 협업 생산성 개선

