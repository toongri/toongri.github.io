        caption: 2022.07 ~ 2023.06
        quote: >
          로컬 마트 주문 중개 플랫폼 '큐마켓' 운영
        description: |
          - 좋아요 집계 테이블 도입으로 상품 리스트 조회 p99 **10초 → 500ms** 단축, 가입자 상품 상세 조회 CTR **10% → 22%** 개선
          - POS 연동 자동화로 피크타임 주문~배달 완료 평균 **90분 → 67분** 단축
